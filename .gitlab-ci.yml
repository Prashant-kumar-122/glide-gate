stages:
  - prepare
  - validate
  - build
  - deploy

# ── SSH setup reused across all stages ───────────────────────────────────────
.ssh_setup: &ssh_setup
  tags:
    - ec2 arm64 ubuntu
  rules:
    - if: '$CI_COMMIT_BRANCH == "COPS_Agentic_AI_Deploy"'
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$EC2_SSH_KEY"
    - ssh-add "$EC2_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H 18.60.103.228 >> ~/.ssh/known_hosts

# ── Stage 1: Prepare ─────────────────────────────────────────────────────────
prepare:
  stage: prepare
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Pulling Latest Code on EC2"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        git fetch origin &&
        git reset --hard origin/COPS_Agentic_AI_Deploy &&
        echo '✓ Code synced successfully'"

# ── Stage 2: Validate ────────────────────────────────────────────────────────
validate-frontend:
  stage: validate
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Validating Frontend Build"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        sudo rm -rf /home/ubuntu/office_project/glidegate/frontend/node_modules &&
        cd /home/ubuntu/office_project/glidegate/frontend &&
        npm install --legacy-peer-deps &&
        npm run build &&
        echo '✓ Frontend build validation passed'"

# ── Stage 3: Build ───────────────────────────────────────────────────────────
build:
  stage: build
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Building Docker Images"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        echo '--- Preparing directories ---' &&
        mkdir -p db/data &&
        sudo chown -R 999:999 db/data &&
        echo '--- Building Docker images ---' &&
        DOCKER_BUILDKIT=0 docker-compose -f docker-compose.prod.yml build &&
        echo '--- Tagging images with $CI_COMMIT_SHORT_SHA ---' &&
        docker tag glidegate_backend:latest glidegate_backend:$CI_COMMIT_SHORT_SHA &&
        docker tag glidegate_frontend:latest glidegate_frontend:$CI_COMMIT_SHORT_SHA &&
        echo '--- Pruning old images keeping last 3 ---' &&
        docker images glidegate_backend --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +4 | xargs -I {} docker rmi glidegate_backend:{} 2>/dev/null || true &&
        docker images glidegate_frontend --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +4 | xargs -I {} docker rmi glidegate_frontend:{} 2>/dev/null || true &&
        echo '✓ Build complete'"

# ── Stage 4: Deploy ──────────────────────────────────────────────────────────
deploy:
  stage: deploy
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Deploying to EC2"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        echo '--- Stopping old containers ---' &&
        docker-compose -f docker-compose.prod.yml down &&
        echo '--- Starting new containers ---' &&
        docker-compose -f docker-compose.prod.yml up -d &&
        echo '--- Container Status ---' &&
        docker-compose -f docker-compose.prod.yml ps &&
        echo '✓ Deployment complete - Commit $CI_COMMIT_SHORT_SHA is live'"
