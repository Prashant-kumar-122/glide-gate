stages:
  - prepare
  - validate
  - build
  - deploy

# ── SSH setup — COPS_Agentic_AI_Deploy ───────────────────────────────────────
.ssh_setup: &ssh_setup
  tags:
    - ec2 arm64 ubuntu
  rules:
    - if: '$CI_COMMIT_BRANCH == "COPS_Agentic_AI_Deploy"'
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$EC2_SSH_KEY"
    - ssh-add "$EC2_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H 18.60.103.228 >> ~/.ssh/known_hosts

# ── SSH setup — main ─────────────────────────────────────────────────────────
.ssh_setup_main: &ssh_setup_main
  tags:
    - ec2 arm64 ubuntu
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$EC2_SSH_KEY"
    - ssh-add "$EC2_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H 18.60.103.228 >> ~/.ssh/known_hosts

# ══════════════════════════════════════════════════════════════════════════════
# COPS_Agentic_AI_Deploy pipeline — full pipeline (unchanged)
# ══════════════════════════════════════════════════════════════════════════════

prepare:
  stage: prepare
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Pulling Latest Code on EC2"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        git fetch origin &&
        git reset --hard origin/COPS_Agentic_AI_Deploy &&
        echo '✓ Code synced successfully'"

validate-frontend:
  stage: validate
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Validating Frontend Build"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        sudo rm -rf /home/ubuntu/office_project/glidegate/frontend/node_modules &&
        cd /home/ubuntu/office_project/glidegate/frontend &&
        npm install --legacy-peer-deps &&
        npm run build &&
        echo '✓ Frontend build validation passed'"

build:
  stage: build
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Building Docker Images"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        DOCKER_BUILDKIT=0 docker-compose -f docker-compose.prod.yml build &&
        docker tag glidegate_backend:latest glidegate_backend:$CI_COMMIT_SHORT_SHA &&
        docker tag glidegate_frontend:latest glidegate_frontend:$CI_COMMIT_SHORT_SHA &&
        docker images glidegate_backend --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +4 | xargs -I {} docker rmi glidegate_backend:{} 2>/dev/null || true &&
        docker images glidegate_frontend --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +4 | xargs -I {} docker rmi glidegate_frontend:{} 2>/dev/null || true &&
        echo '✓ Build complete'"

deploy:
  stage: deploy
  <<: *ssh_setup
  script:
    - echo "=========================================="
    - echo "   Deploying to EC2"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        docker-compose -f docker-compose.prod.yml down &&
        docker-compose -f docker-compose.prod.yml up -d &&
        docker-compose -f docker-compose.prod.yml ps &&
        echo '✓ Deployment complete - Commit $CI_COMMIT_SHORT_SHA is live'"

# ══════════════════════════════════════════════════════════════════════════════
# Feature branch / MR pipeline — prepare + validate + build on runner (no deploy)
# ══════════════════════════════════════════════════════════════════════════════

validate-frontend-feature:
  stage: validate
  tags:
    - ec2 arm64 ubuntu
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH != "COPS_Agentic_AI_Deploy" && $CI_COMMIT_BRANCH != "main"'
      when: always
  script:
    - echo "=========================================="
    - echo "   [Feature] Validating Frontend Build"
    - echo "   Branch - $CI_COMMIT_BRANCH"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - cd frontend
    - npm install --legacy-peer-deps
    - npm run build
    - echo "✓ Frontend build validation passed"

build-feature:
  stage: build
  tags:
    - ec2 arm64 ubuntu
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH != "COPS_Agentic_AI_Deploy" && $CI_COMMIT_BRANCH != "main"'
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$EC2_SSH_KEY"
    - ssh-add "$EC2_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H 18.60.103.228 >> ~/.ssh/known_hosts
  script:
    - echo "=========================================="
    - echo "   [Feature] Building Docker Images"
    - echo "   Branch - $CI_COMMIT_BRANCH"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        git fetch origin &&
        git reset --hard origin/$CI_COMMIT_REF_NAME &&
        DOCKER_BUILDKIT=0 docker-compose -f docker-compose.prod.yml build &&
        echo '✓ Docker build passed'"

# ══════════════════════════════════════════════════════════════════════════════
# Main pipeline — full pipeline triggered on merge to main
# ══════════════════════════════════════════════════════════════════════════════

prepare-main:
  stage: prepare
  <<: *ssh_setup_main
  script:
    - echo "=========================================="
    - echo "   [Main] Pulling Latest Code on EC2"
    - echo "   Commit - $CI_COMMIT_SHORT_SHA"
    - echo "=========================================="
