    - echo "=========================================="
    - ssh ubuntu@18.60.103.228 "
        cd /home/ubuntu/office_project/glidegate &&
        DOCKER_BUILDKIT=0 docker-compose -f docker-compose.prod.yml build &&
        docker tag glidegate_backend:latest glidegate_backend:$CI_COMMIT_SHORT_SHA &&
        docker tag glidegate_frontend:latest glidegate_frontend:$CI_COMMIT_SHORT_SHA &&
        docker images glidegate_backend --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +4 | xargs -I {} docker rmi glidegate_backend:{} 2>/dev/null || true &&
        docker images glidegate_frontend --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +4 | xargs -I {} docker rmi glidegate_frontend:{} 2>/dev/null || true &&
        echo '✓ Build complete'"

deploy-main:
