services:
  postgres:
    image: postgres:16-alpine
    container_name: glide_gate_db
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newpassword}
      POSTGRES_DB: ${DB_NAME:-glide_gate}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glide_gate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glide_gate_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
    container_name: glide_gate_backend
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-Root}@postgres:5432/${DB_NAME:-glide_gate}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-Root}@postgres:5432/${DB_NAME:-glide_gate}
    ports:
      - "8000:8000"
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - glide_gate_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glide_gate_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_TIMEOUT: "30000"
    command: npm run dev
    depends_on:
      - backend
    networks:
      - glide_gate_network
    restart: unless-stopped

networks:
  glide_gate_network:
    driver: bridge
