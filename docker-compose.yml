services:
  postgres:
    image: postgres:16-alpine
    container_name: glide_gate_db
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newpassword}
      POSTGRES_DB: ${DB_NAME:-glide_gate}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - glide_gate_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glide_gate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glide_gate_network

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
      args:
        PYTHON_VERSION: "3.12"
    container_name: glide_gate_backend
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-Root}@postgres:5432/${DB_NAME:-glide_gate}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-Root}@postgres:5432/${DB_NAME:-glide_gate}
      TEMPORAL_ENABLED: "true"
      TEMPORAL_HOST: "temporal:7233"
      # Backend reaches Keycloak via Docker-internal hostname for JWKS validation
      KEYCLOAK_URL: "http://keycloak:8180"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: >
      sh -c "gunicorn app.main:socket_app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - glide_gate_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glide_gate_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      # Vite dev-server proxy target (server-side, Docker-internal hostname is correct here)
      VITE_API_URL: http://backend:8000
      VITE_API_TIMEOUT: "30000"
      # Browser-facing URLs — must be localhost so the user's browser can reach them
      VITE_KEYCLOAK_URL: "http://localhost:8180"
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173', r => r.statusCode < 400 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend
    networks:
      - glide_gate_network
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: glide_gate_temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgres12
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-newpassword}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - glide_gate_network
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: glide_gate_temporal_ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    networks:
      - glide_gate_network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: glide_gate_keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-Root}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./scripts/keycloak:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8180/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - glide_gate_network
    restart: unless-stopped

volumes:
  glide_gate_postgres_data:
  keycloak_data:

networks:
  glide_gate_network:
    driver: bridge
