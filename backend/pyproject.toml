[tool.poetry]
name = "glide-gate-backend"
version = "0.1.0"
description = "GlideGate CADF — AI-powered wealth management onboarding backend"
authors = ["GlideGate Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }

# WebSocket
python-socketio = "^5.11.0"

# Database
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
asyncpg = "^0.30.0"
alembic = "^1.14.0"

# Validation
pydantic = { version = "^2.10.0", extras = ["email"] }
pydantic-settings = "^2.6.0"

# AI providers
anthropic = "^0.40.0"
openai = "^1.57.0"
google-generativeai = "^0.8.0"

# HTTP client
httpx = "^0.28.0"

# File handling
python-multipart = "^0.0.12"
pillow = "^11.0.0"
aiofiles = "^24.1.0"
pypdf = "^5.0.0"

# Auth
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }

# Logging
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
factory-boy = "^3.3.1"
faker = "^33.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
